name: Apple pickup monitor
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = monitor; test = labelled notification test; dry-run = no notifications'
        required: true
        default: run
        type: choice
        options: [run, test, dry-run]
permissions:
  contents: write
concurrency:
  group: apple-pickup-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Enable in Repository Settings > Secrets and variables > Actions > Variables.
    # Manual dry runs and notification tests remain usable before activation.
    if: vars.MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check, confirm, notify, and persist state
        env:
          MODE: ${{ inputs.mode || 'run' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          case "$MODE" in
            test) python monitor.py --test-notifications ;;
            dry-run) python monitor.py --dry-run ;;
            run) python monitor.py --github-state ;;
            *) exit 2 ;;
          esac
